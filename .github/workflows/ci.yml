name: CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: uk-crime-data-pipeline-509515
  REGION: europe-west2
  GAR_REPOSITORY: data-pipelines
  IMAGE_NAME: uk-crime-pipeline
  CLOUD_RUN_JOB: uk-crime-pipeline-job

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Python tests
        run: |
          python -m pytest -v

      - name: Build Docker image
        run: |
          docker build -t uk-crime-pipeline:test .

      # Everything below this point runs only after a push to main,
      # not for pull requests.

      - name: Authenticate to Google Cloud
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/696671937089/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: crime-pipeline-deployer@uk-crime-data-pipeline-509515.iam.gserviceaccount.com

      - name: Set up gcloud
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          gcloud auth configure-docker $REGION-docker.pkg.dev --quiet

      - name: Tag Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag uk-crime-pipeline:test \
            $REGION-docker.pkg.dev/$PROJECT_ID/$GAR_REPOSITORY/$IMAGE_NAME:$GITHUB_SHA

          docker tag uk-crime-pipeline:test \
            $REGION-docker.pkg.dev/$PROJECT_ID/$GAR_REPOSITORY/$IMAGE_NAME:latest

      - name: Push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push \
            $REGION-docker.pkg.dev/$PROJECT_ID/$GAR_REPOSITORY/$IMAGE_NAME:$GITHUB_SHA

          docker push \
            $REGION-docker.pkg.dev/$PROJECT_ID/$GAR_REPOSITORY/$IMAGE_NAME:latest

      - name: Deploy to Cloud Run Job
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          gcloud run jobs update $CLOUD_RUN_JOB \
            --image=$REGION-docker.pkg.dev/$PROJECT_ID/$GAR_REPOSITORY/$IMAGE_NAME:$GITHUB_SHA \
            --region=$REGION \
            --project=$PROJECT_ID