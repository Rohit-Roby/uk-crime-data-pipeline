version: 2

models: 
  - name: monthly_crime_summary
    description: > 
      Monthly crime counts by category.
      The grain of this model is one row per crime_month and category.
  
    columns: 
      - name: crime_month
        description: > 
          Month in which the crime were reported, represented as a DATE using the first day of the month.
        data_tests:
          - not_null
      
      - name: category
        description: >
          UK Police crime category.
        data_tests:
          - not_null
      
      - name: total_crimes
        description: >
          Total Number of crime records for the given crime month and category.
        data_tests:
          - not_null
  - name: crime_category_trends
    description: "Month-over-month crime trends by category."

    columns:
      - name: crime_month
        tests:
          - not_null

      - name: category
        tests:
          - not_null

      - name: total_crimes
        tests:
          - not_null
  - name: monthly_street_summary
    description: "Monthly crime totals by street for hotspot and location analysis."

    columns:
      - name: crime_month
        tests:
          - not_null

      - name: street
        tests:
          - not_null

      - name: total_crimes
        tests:
          - not_null